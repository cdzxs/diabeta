<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records - DiaBeta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body class="records-page">
    <main class="page-shell">
        <header class="result-header">
            <a class="brand-mark" href="/?assessment=1" aria-label="DiaBeta assessment">
                <img src="{{ url_for('static', filename='diabeta-logo.png') }}" alt="DiaBeta logo">
                <span>DiaBeta</span>
            </a>
            <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" data-drawer-toggle>
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="top-nav" aria-label="Main navigation">
                <a href="/?assessment=1">Assessment</a>
                <a href="/about">About</a>
                <a href="/about-me">About Me</a>
                <button class="secondary-action danger-action" type="button" data-clear-records>Clear Records</button>
            </nav>
        </header>
        <div class="drawer-overlay" aria-hidden="true"></div>
        <aside class="side-drawer" aria-hidden="true">
            <button class="drawer-close" type="button" aria-label="Close navigation menu" data-drawer-close>&times;</button>
            <nav class="drawer-nav" aria-label="Mobile navigation">
                <a href="/?assessment=1">Assessment</a>
                <a href="/about">About</a>
                <a href="/about-me">About Me</a>
                <button class="secondary-action danger-action" type="button" data-clear-records>Clear Records</button>
            </nav>
        </aside>

        <section class="page-hero">
            <p class="eyebrow">Saved locally</p>
            <h1>Assessment records</h1>
            <p>Your previous assessments are stored in this browser only. You can clear them at any time.</p>
        </section>

        <section class="records-list" id="recordsList" aria-live="polite"></section>
    </main>

    <div class="record-modal" id="recordModal" hidden>
        <div class="record-modal-panel" role="dialog" aria-modal="true" aria-labelledby="recordModalTitle">
            <button class="modal-close" type="button" data-close-record>Close</button>
            <div id="recordModalContent"></div>
        </div>
    </div>
    <script>
        (function () {
            function setHeaderHeight() {
                const header = document.querySelector('.assessment-header, .result-header');
                if (!header) return;
                const height = header.offsetHeight;
                document.documentElement.style.setProperty('--header-h', (height + 16) + 'px');
                // +16px gives a small visible gap so content doesn't touch the header edge
            }

            window.addEventListener('load', setHeaderHeight);
            window.addEventListener('resize', setHeaderHeight);
        })();
</script>

    <script src="app.js"></script>
</body>
</html>
